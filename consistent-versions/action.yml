# actions/consistent-versions/action.yml
#
# Prerequisites (caller workflow):
#   1. actions/checkout@v4 (before this action)
#   2. composer.json with szepeviktor/consistent-versions in require-dev and
#      check-versions / check-versions-tag Composer scripts
#   3. Project-level .github/consistent-versions.yaml (and optionally
#      .github/consistent-versions-tag.yaml for tag pushes)
#   4. Job permissions: contents: read

name: Check Consistent Versions

description: |
  Installs PHP dependencies and runs the project's Composer check-versions
  scripts so version declarations across project files agree. On tag pushes,
  optionally runs check-versions-tag when the tag config file exists.

  **Caller workflow must check out the repository first** and declare
  `szepeviktor/consistent-versions` with `check-versions` scripts in
  composer.json.

inputs:
  php-version:
    description: PHP version used to run the checker.
    required: false
    default: "8.1"

runs:
  using: composite

  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none

    - name: Install PHP Dependencies
      uses: ramsey/composer-install@v3
      with:
        dependency-versions: highest

    - name: Check version consistency
      run: composer check-versions
      shell: bash

    - name: Check Git tag
      if: github.ref_type == 'tag'
      run: |
        if [ ! -f .github/consistent-versions-tag.yaml ]; then
          echo "Skipping tag check: .github/consistent-versions-tag.yaml not found."
          exit 0
        fi
        composer check-versions-tag
      shell: bash
