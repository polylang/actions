name: Run Playwright e2e Tests

description: Installs WordPress, starts the server, builds dependencies and run Playwright tests. Currently runs on PHP 8.0 with WordPress latest release.

inputs:
  wp-env-config-path:
    description: Path to a custom wp-env config file passed to wp-env --config. Default is '' (wp-env default discovery).
    required: false
    type: string
    default: ''
  playwright-cmd:
    description: CLI command to run playwright tests. Default is 'npm run test:e2e'.
    required: false
    type: string
    default: 'npm run test:e2e'

runs:
  using: 'composite'

  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Get Node.js version
      id: node-version
      run: echo "NODE_VERSION=$(node -v)" >> "$GITHUB_OUTPUT"
      shell: bash

    # Repos without a committed lockfile (e.g. Polylang) need one for npm ci / cache key.
    - name: Set up package-lock.json
      run: |
        if [ ! -f package-lock.json ]; then
          npm install --package-lock-only --no-audit
        fi
      shell: bash

    - name: Cache node_modules
      id: cache-node_modules
      uses: actions/cache@v4
      with:
          path: '**/node_modules'
          key: node_modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.NODE_VERSION }}-${{ hashFiles('package.json', 'package-lock.json') }}

    - name: Install dependencies
      if: ${{ steps.cache-node_modules.outputs.cache-hit != 'true' }}
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install --no-audit
        fi
      shell: bash

    # Must install PHP deps before wp-env is running to prevent errors.
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        coverage: none
        php-version: '8.0'

    - name: Install PHP Dependencies
      uses: ramsey/composer-install@v3
      with:
        dependency-versions: 'highest'
        composer-options: '--no-dev --optimize-autoloader'

    - name: Build dependencies
      run: npm run build --if-present
      shell: bash

    - name: Get installed Playwright version
      id: playwright-version
      run: |
        PLAYWRIGHT_VERSION=$(node "${{ github.action_path }}/../bin/get-playwright-version.js")
        echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"
      shell: bash

    - name: Cache Playwright binaries
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright binaries
      # Only Chromium for the moment.
      run: |
        npx playwright install chromium --with-deps
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit != 'true'

    - name: Install WordPress and start the server
      run: |
        if [ -n "${{ inputs.wp-env-config-path }}" ]; then
          npm run wp-env start -- --config="${{ inputs.wp-env-config-path }}"
        else
          npm run wp-env start
        fi
      shell: bash

    - name: Run Playwright tests
      run: ${{ inputs.playwright-cmd }}
      shell: bash

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
