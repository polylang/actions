name: Run Playwright e2e Tests

description: Installs WordPress, starts the server, builds dependencies and run Playwright tests. PHP version is read from the consumer wp-env config.

inputs:
  wp-env-cache-key:
    description: Extra cache key fragment for the wp-env home directory. Use for inputs not reflected in wp-env config (e.g. WooCommerce version, Polylang Pro commit).
    required: false
    type: string
    default: 'default'
  wp-env-config-path:
    description: Path to the wp-env config file passed to wp-env --config and used to resolve PHP version.
    required: false
    type: string
    default: '.wp-env.json'
  playwright-cmd:
    description: CLI command to run playwright tests. Default is 'npm run test:e2e'.
    required: false
    type: string
    default: 'npm run test:e2e'

runs:
  using: 'composite'

  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Get Node.js version
      id: node-version
      run: echo "NODE_VERSION=$(node -v)" >> "$GITHUB_OUTPUT"
      shell: bash

    # Repos without a committed lockfile still need one for npm ci / cache key.
    - name: Set up package-lock.json
      run: |
        if [ ! -f package-lock.json ]; then
          npm install --package-lock-only --no-audit
        fi
      shell: bash

    - name: Cache node_modules
      id: cache-node_modules
      uses: actions/cache@v4
      with:
          path: '**/node_modules'
          key: node_modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.NODE_VERSION }}-${{ hashFiles('package.json', 'package-lock.json') }}

    - name: Install dependencies
      if: ${{ steps.cache-node_modules.outputs.cache-hit != 'true' }}
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install --no-audit
        fi
      shell: bash

    - name: Get PHP version from wp-env config
      id: wp-env-php-version
      run: |
        PHP_VERSION=$(node "${{ github.action_path }}/../bin/get-wp-env-php-version.js" "${{ inputs.wp-env-config-path }}")
        echo "PHP_VERSION=$PHP_VERSION" >> "$GITHUB_OUTPUT"
      shell: bash

    # Must install PHP deps before wp-env is running to prevent errors.
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        coverage: none
        php-version: ${{ steps.wp-env-php-version.outputs.PHP_VERSION }}

    - name: Install PHP Dependencies
      uses: ramsey/composer-install@v3
      with:
        dependency-versions: 'highest'
        composer-options: '--no-dev --optimize-autoloader'

    # Pin home so CI does not depend on /snap detection (~/wp-env vs ~/.wp-env).
    # Same WP_ENV_HOME behavior in @wordpress/env 10 and 11.
    - name: Set wp-env home directory
      run: echo "WP_ENV_HOME=${HOME}/.wp-env" >> "$GITHUB_ENV"
      shell: bash

    - name: Get @wordpress/env version
      id: wp-env-version
      run: |
        echo "WP_ENV_VERSION=$(node -e "console.log(require('@wordpress/env/package.json').version)")" >> "$GITHUB_OUTPUT"
      shell: bash

    # When core is "latest" (null), bust the workdir cache when WordPress.org ships a new release.
    - name: Get WordPress latest version
      id: wp-version
      run: |
        echo "WP_VERSION=$(node -e "fetch('https://api.wordpress.org/core/version-check/1.7/').then(r => r.json()).then(data => console.log(data.offers[0].current))")" >> "$GITHUB_ENV"
      shell: bash

    # Hash only the config this job starts. Dev and test are separate wp-env
    # workdirs (wp-env-<project>-dev-* vs -test-*); including .wp-env.dev.json
    # would bust the test cache without ever creating the dev environment.
    - name: Get wp-env config hash
      id: wp-env-config-hash
      run: |
        echo "HASH=$(sha256sum "${{ inputs.wp-env-config-path }}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      shell: bash

    # Key: {os}-wp-env-home-{@wordpress/env}-{WP latest}-{hash(started config)}-{wp-env-cache-key}
    - name: Cache wp-env home
      id: wp-env-home-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.WP_ENV_HOME }}
        key: ${{ runner.os }}-wp-env-home-${{ steps.wp-env-version.outputs.WP_ENV_VERSION }}-${{ env.WP_VERSION }}-${{ steps.wp-env-config-hash.outputs.HASH }}-${{ inputs.wp-env-cache-key }}
        restore-keys: |
          ${{ runner.os }}-wp-env-home-${{ steps.wp-env-version.outputs.WP_ENV_VERSION }}-${{ steps.wp-env-config-hash.outputs.HASH }}-${{ inputs.wp-env-cache-key }}
          ${{ runner.os }}-wp-env-home-${{ steps.wp-env-version.outputs.WP_ENV_VERSION }}-

    # WP_ENV_HOME holds WordPress sources + wp-env-cache.json, not database volumes.
    # On a cache hit the config checksum makes wp-env skip `wp core install` against
    # empty DB volumes → REST API / rewrite failures. Drop the checksum so start
    # reconfigures while still reusing downloaded sources (wp-env 10 and 11).
    - name: Force wp-env reconfigure after home cache restore
      if: steps.wp-env-home-cache.outputs.cache-hit == 'true'
      run: find "${WP_ENV_HOME}" -name 'wp-env-cache.json' -delete
      shell: bash

    - name: Get installed Playwright version
      id: playwright-version
      run: |
        PLAYWRIGHT_VERSION=$(node "${{ github.action_path }}/../bin/get-playwright-version.js")
        echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_ENV"
      shell: bash

    - name: Cache Playwright binaries
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install WordPress and start the server
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
          node "${{ github.action_path }}/../bin/run-e2e-parallel-setup.js" \
            --config="${{ inputs.wp-env-config-path }}" \
            --with-playwright-browsers
        else
          node "${{ github.action_path }}/../bin/run-e2e-parallel-setup.js" \
            --config="${{ inputs.wp-env-config-path }}"
        fi
      shell: bash

    - name: Run Playwright tests
      run: ${{ inputs.playwright-cmd }}
      shell: bash

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      with:
        name: playwright-report
        # Config lives under tests/e2e/, so Playwright writes the HTML report and
        # failure attachments (screenshots, snapshot diffs, traces) there — not repo root.
        path: |
          tests/e2e/playwright-report/
          tests/e2e/test-results/
        retention-days: 7
