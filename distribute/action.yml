# actions/distribute/action.yml
#
# Prerequisites (caller workflow):
#   1. actions/checkout@v4 with fetch-depth: 0 (before this action)
#   2. Job permissions (caller must set explicitly):
#        contents: read          # checkout
#        actions: write          # upload artifact
#        pull-requests: write    # PR comment (optional if no PR context)
#   3. env COMPOSER_AUTH on the step (if private Composer packages)

name: Build distribution ZIP
description: |
  Builds a WordPress plugin/theme distribution ZIP using @wpsyntex/distribute,
  uploads it as a GitHub Actions artifact, and posts a download link.

  **Caller workflow must set job permissions:**
  ```yaml
  permissions:
    contents: read
    actions: write
    pull-requests: write
  ```

  **Prerequisites:** run `actions/checkout@v4` with `fetch-depth: 0` before
  this action. Pass `COMPOSER_AUTH` via `env` if needed.

inputs:
  mode:
    description: Distribution mode (production or dev).
    required: false
    default: production
  version:
    description: Version strategy (commit, tag) or literal string.
    required: false
    default: commit
  npm-cmd:
    description: Override npm build script to run.
    required: false
  node-version:
    description: Node.js version.
    required: false
    default: "22"
  php-version:
    description: PHP version.
    required: false
    default: "8.5"
  retention-days:
    description: Artifact retention in days.
    required: false
    default: "30"

outputs:
  artifact-name:
    description: Uploaded artifact name.
    value: ${{ steps.name.outputs.artifact-name }}
  artifact-url:
    description: Authenticated download URL for the ZIP artifact.
    value: ${{ steps.upload.outputs.artifact-url }}
  run-url:
    description: GitHub Actions run page (fallback link).
    value: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

runs:
  using: composite

  steps:
    - name: Set up PHP ${{ inputs.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        coverage: none
        php-version: ${{ inputs.php-version }}
        tools: composer

    - name: Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install consumer npm dependencies
      shell: bash
      run: |
        if [[ -f package-lock.json ]]; then
          npm ci
        elif [[ -f package.json ]]; then
          npm install
        fi

    - name: Install @wpsyntex/distribute
      shell: bash
      run: |
        VERSION=$(node -p "try { require('./package.json').devDependencies['@wpsyntex/distribute'] } catch(e) { '' }" 2>/dev/null || echo "")
        if [[ -n "$VERSION" ]]; then
          npm install -D "@wpsyntex/distribute@${VERSION}"
        else
          npm install -D @wpsyntex/distribute@latest
        fi

    - name: Run distribute
      id: distribute
      shell: bash
      env:
        COMPOSER_AUTH: ${{ env.COMPOSER_AUTH }}
      run: |
        SEQUENTIAL=""
        if [[ "${RUNNER_DEBUG}" == "1" || "${ACTIONS_STEP_DEBUG}" == "true" || "${ACTIONS_RUNNER_DEBUG}" == "true" ]]; then
          SEQUENTIAL="--sequential"
        fi

        ARGS=(--mode "${{ inputs.mode }}" --version "${{ inputs.version }}")
        if [[ -n "$SEQUENTIAL" ]]; then
          ARGS+=("$SEQUENTIAL")
        fi
        if [[ -n "${{ inputs.npm-cmd }}" ]]; then
          ARGS+=(--npm-cmd "${{ inputs.npm-cmd }}")
        fi

        npx distribute "${ARGS[@]}"

    - name: Resolve ZIP path
      id: name
      shell: bash
      run: |
        shopt -s nullglob
        zips=(dist/*.zip)
        if [[ ${#zips[@]} -eq 0 ]]; then
          echo "::error::No ZIP file found in dist/"
          exit 1
        fi
        if [[ ${#zips[@]} -gt 1 ]]; then
          echo "::warning::Multiple ZIP files found in dist/; using ${zips[0]}"
        fi
        zip_path="${zips[0]}"
        artifact_name="$(basename "$zip_path" .zip)"
        echo "zip-path=${zip_path}" >> "$GITHUB_OUTPUT"
        echo "artifact-name=${artifact_name}" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.name.outputs.artifact-name }}
        path: ${{ steps.name.outputs.zip-path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error

    - name: Write job summary
      shell: bash
      run: |
        {
          echo "## Distribution ZIP"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Mode | \`${{ inputs.mode }}\` |"
          echo "| Version | \`${{ inputs.version }}\` |"
          echo "| Artifact | \`${{ steps.name.outputs.artifact-name }}\` |"
          if [[ -n "${{ steps.upload.outputs.artifact-url }}" ]]; then
            echo "| Download | [${{ steps.name.outputs.artifact-name }}](${{ steps.upload.outputs.artifact-url }}) |"
          else
            echo "| Run | [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Post console notice
      shell: bash
      run: |
        URL="${{ steps.upload.outputs.artifact-url }}"
        if [[ -z "$URL" ]]; then
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
        echo "::notice title=Distribution ready::Download at ${URL}"

    - name: Comment on pull request
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const marker = '<!-- polylang-distribute-zip -->';
          const mode = '${{ inputs.mode }}';
          const artifactName = '${{ steps.name.outputs.artifact-name }}';
          let downloadUrl = '${{ steps.upload.outputs.artifact-url }}';
          if (!downloadUrl) {
            downloadUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
          }
          const sha = context.sha.substring(0, 7);

          const body = `${marker}
          📦 **Distribution ZIP** (\`${mode}\`)

          Download: [${artifactName}](${downloadUrl})

          Built from commit \`${sha}\`.`;

          let prNumber = null;

          if (context.eventName === 'pull_request') {
            prNumber = context.payload.pull_request?.number;
          } else {
            const branch = context.ref.replace('refs/heads/', '');
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (pulls.length > 0) {
              prNumber = pulls[0].number;
            }
          }

          if (!prNumber) {
            core.info('No open pull request found; skipping comment.');
            return;
          }

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          });

          const existing = comments.find(
            (c) => c.user.type === 'Bot' && c.body?.includes(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
          }
